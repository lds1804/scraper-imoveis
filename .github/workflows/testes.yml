name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests tools

      # banco sintético (tests/fabrica.py); os testes `dados_reais` são
      # pulados porque o imoveis.db não vai para o repositório
      - name: Testes (pytest)
        run: python -m pytest

      - name: Nenhum segredo no repositório
        run: python tools/conferir_segredos.py
